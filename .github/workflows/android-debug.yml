name: Android Debug

on:
  push:
    branches: [main, master]
    paths: [android/**, engine/**, .github/workflows/android-debug.yml]
  pull_request:
    paths: [android/**, engine/**, .github/workflows/android-debug.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build debug APK (arm64-v8a only)
        run: gradle -p android assembleDebug -Pandroid.injected.build.abi=arm64-v8a --stacktrace

      - name: Stage debug APK
        run: |
          mkdir -p apk-out
          find android/app/build -name "*.apk" -type f -exec cp {} apk-out/ \;
          ls apk-out/

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk-arm64
          path: apk-out/*.apk
          if-no-files-found: error
